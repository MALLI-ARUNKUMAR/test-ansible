- name: filters
  connection: local
  hosts: local
  vars:
    topics: linux,shell,ansible,terraform
    my_tags:
      name: ansible
      project: roboshop
      component: mongodb  
  tasks:
  - name: converting the string to list
    ansible.builtin.debug:
      msg: "{{ topics | split(',') }}"
  - name: converting the map to list
    ansible.builtin.debug:
      msg: "{{ my_tags | dict2items }}"    