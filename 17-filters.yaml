- name: filters
  connection: local
  hosts: local
  vars:
    topics: linux,shell,ansible,terraform
  tags_map:
    name: ansible
    project: roboshop
    component: mongodb  
  tasks:
  - name: converting the string to list
    ansible.builtin.debug:
      msg: "{{ topics | split(',') }}"
  - name: converting the map to list
    ansible.builtin.debug:
      msg: "{{ tags_map | dict2items }}"    