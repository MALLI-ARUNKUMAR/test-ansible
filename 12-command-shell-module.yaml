- name: shell vs command
  connection: local
  hosts: local
  tasks:
  - name: test the shell and command 
    ansible.builtin.shell: cat /etc/passwd | grep root
    register: user
    
  - name: print output
    ansible.builtin.debug:
      msg: "{{ user }}"

  - name: test the shell and command 
    ansible.builtin.shell: ls -ltr > file.txt
    register: files-output
    
  - name: print output
    ansible.builtin.debug:
      msg: "{{ files-output }}"    
